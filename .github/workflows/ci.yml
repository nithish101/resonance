name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test with coverage
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          {
            echo '### Rust coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info
          retention-days: 14

  web:
    name: Web (lint, types, unit, budget, e2e, Lighthouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare-assets
      - run: pnpm exec eslint . --max-warnings 0
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - name: Unit tests (web + infra assertions)
        run: pnpm test:unit
      - name: CDK synth
        run: pnpm --filter @resonance/infra synth
      - name: Production build
        run: pnpm --filter @resonance/web exec vite build
      - name: Bundle-size budget (350 KB gzipped)
        run: |
          node scripts/size-budget.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install Playwright browsers
        run: pnpm --filter @resonance/web exec playwright install --with-deps chromium
      - name: Smoke test against the production build
        run: |
          pnpm --filter @resonance/web exec vite preview --port 4173 &
          for _ in $(seq 60); do curl -sf http://localhost:4173 >/dev/null && break; sleep 0.5; done
          node scripts/smoke.mjs http://localhost:4173 --local
          kill %1
      - name: e2e, visual regression, accessibility
        run: pnpm test:e2e
      - name: Lighthouse CI
        run: |
          CHROME_PATH="$(node scripts/chrome-path.mjs)"
          export CHROME_PATH
          pnpm exec lhci autorun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            packages/web/playwright-report
            packages/web/test-results
            .lighthouseci
          retention-days: 7
