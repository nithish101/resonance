[package]
name = "resonance-dsp"
version = "0.1.0"
description = "Real-time music analysis: FFT, STFT, mel, onsets, tempo, beats, chroma"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]

[dev-dependencies]
resonance-fixtures = { path = "../fixtures" }
rustfft = "6"
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "dsp"
harness = false
